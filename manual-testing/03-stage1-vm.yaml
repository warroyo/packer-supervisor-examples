# STEP 3: Stage 1 installation VM. Boots from the ISO imported in Step 1.
# Apply the PVC first, then the VirtualMachine.
#
# ── GRUB BOOT COMMAND ─────────────────────────────────────────────────────────
# Open the VM console in vSphere. At the GRUB menu press 'e', go to the
# linuxefi line, and append this single line, then press Ctrl-x / F10:
#
#   ip=<VM-IP>::<GATEWAY>:<NETMASK>:<HOSTNAME>:ens192:none nameserver=<DNS> inst.ks=http://<LB-IP>/ks.cfg
#
# <VM-IP>    free IP on the workload network (temporary, install only)
# <GATEWAY>  workload network default gateway
# <NETMASK>  e.g. 255.255.255.0
# <HOSTNAME> any short name
# <DNS>      nameserver on the workload network
# <LB-IP>    EXTERNAL-IP of kickstart-service:
#              kubectl get svc kickstart-service -n production-c5b8n
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: boot-disk
  namespace: production-c5b8n
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Block
  resources:
    requests:
      storage: 20Gi
  storageClassName: vsan-default-storage-policy
---
apiVersion: vmoperator.vmware.com/v1alpha4
kind: VirtualMachine
metadata:
  name: ol9-stage1
  namespace: production-c5b8n
spec:
  className: best-effort-medium
  storageClass: vsan-default-storage-policy
  powerState: PoweredOn
  guestID: otherGuest
  volumes:
    - name: boot-iso
      persistentVolumeClaim:
        claimName: boot-disk
  cdrom:
    - name: installiso
      image:
        name: vmi-e8e46b7e213456c57   # VirtualMachineImage name — kubectl get vmi -n production-c5b8n
        kind: VirtualMachineImage
      connected: true
      allowGuestControl: true
