# STEP 1: Stream the Oracle Linux 9 DVD ISO into the Supervisor Content Library.
# The Supervisor polls the import request until the item appears in the library,
# at which point Step 3 can reference it.
apiVersion: imageregistry.vmware.com/v1alpha1
kind: ContentLibraryItemImportRequest
metadata:
  name: oraclelinux-9-dvd-iso
  namespace: my-tanzu-namespace
spec:
  source:
    url: "https://yum.oracle.com/ISOS/OracleLinux/OL9/u5/x86_64/OracleLinux-R9-U5-x86_64-dvd.iso"
    # sslCertificate: |
    #   -----BEGIN CERTIFICATE-----
    #   <PEM block for custom CA or self-signed mirror>
    #   -----END CERTIFICATE-----
    checksum:
      type: SHA256
      value: "<sha256-of-iso>"
  target:
    library:
      name: cl-production-images
    item:
      name: oraclelinux-9-dvd-iso
      type: ISO
